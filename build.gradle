// For those who want the bleeding edge
buildscript {
    repositories {
        jcenter()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
plugins {
    id 'com.matthewprenger.cursegradle' version '1.0.9'
}
apply plugin: 'net.minecraftforge.gradle.forge'

ext.buildnumber = 0
project.buildnumber = System.getenv('BUILD_NUMBER') ?: '127'

boolean dev = System.getenv('RELEASE') == null || System.getenv('RELEASE').equals('false');

version = "${mod_version}.${buildnumber}"
group= "net.tropicraft" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "tropicraft-legacy"

sourceCompatibility = targetCompatibility = '1.8'

repositories {
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url "http://maven.ic2.player.to/"
    }
    maven {
        url "https://maven.covers1624.net/"
    }
    maven {
        url "http://chickenbones.net/maven/"
    }
    maven {
        url "https://maven.blamejared.com"
    }
}

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = "run"

    mappings = "snapshot_20171116"

    replaceIn "Info.java"
    replace "@VERSION@", project.version
}

jar.appendix = "MC${minecraft_version}"
sourceJar.appendix = jar.appendix

dependencies {
    compileOnly("net.sengir.forestry:forestry_1.12.2:5.8.2.422") { transitive = false }
    compileOnly "codechicken:CodeChickenLib:1.12.2-3.2.2.354:universal"
    compileOnly "cofh:RedstoneFlux:1.12-2.1.0.7:universal"
    compileOnly "cofh:CoFHWorld:1.12.2-1.3.0.6:universal"
    compileOnly "cofh:CoFHCore:1.12.2-4.6.2.25:universal"
    compileOnly "cofh:ThermalFoundation:1.12.2-2.6.2.26:universal"
    compileOnly "cofh:ThermalExpansion:1.12.2-5.5.3.41:universal"
    compileOnly "mezz.jei:jei_1.12.2:4.9.2.196"

    compileOnly "curse.maven:pams-harvestcraft-221857:2904825"
    compileOnly "curse.maven:unlimited-chisel-works-278493:3319307"
    compileOnly "curse.maven:railcraft-51195:3853491"
    compileOnly "curse.maven:immersive-engineering-231951:2974106"
    compileOnly "curse.maven:ex-nihilo-creatio-274456:2817545"
    compileOnly "curse.maven:coroutil-237749:2902920"
    compileOnly "curse.maven:future-mc-310059:6162819"
}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft_version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

String getChangelogText() {
    def changelogFile = file('changelog.txt')
    String str = ''
    int lineCount = 0
    boolean done = false
    changelogFile.eachLine {
        if (done || it == null) {
            return
        }
        if (it.size() > 1) {
            def temp = it
            if (lineCount == 0) {
                temp = "Tropicraft ${version}"
                temp = "<h2>$temp</h2>"
            } else if (it.startsWith('-')) {
                temp = "&nbsp;&nbsp;&nbsp;$temp"
                temp = temp.replaceAll("(\\S+\\/\\S+)#([0-9]+)\\b", "<a href=\"https://github.com/\$1/issues/\$2\">\$0</a>");
                temp = temp.replaceAll("#([0-9]+)\\b(?!<\\/a>)", "<a href=\"https://github.com/$github_project/issues/\$1\">\$0</a>");
            } else {
                temp = "<h4>$temp</h4>"
            }
            str += "$temp<br/>"
            lineCount++
            return
        } else {
            done = true
        }
    }
    return str
}

tasks.curseforge.enabled = !dev && project.hasProperty('cojo_curseforge_key')
    
curseforge {
    if (project.hasProperty('cojo_curseforge_key')) {
        apiKey = project.cojo_curseforge_key
    }

    project {
        id = project.projectId
        changelog = System.getenv('CHANGELOG') == null || System.getenv('CHANGELOG').equals('none') ? getChangelogText() : System.getenv('CHANGELOG')
        changelogType = 'html'
        releaseType = project.curse_type
        mainArtifact(jar) {
            displayName = "Tropicraft - ${version}"
        }
    }
}
